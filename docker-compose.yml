# Docker Compose convenience stack for local Odoo 19 development.
# This file is OPTIONAL — it provides a quick way to spin up Odoo + PostgreSQL
# without installing them on the host.  S3 mocking for tests is handled
# entirely in-process by Moto; no additional containers are required.
#
# Usage:
#   docker compose up -d        # start Odoo + PostgreSQL
#   docker compose down -v      # stop and remove volumes
#
# S3 storage backend — see IR_ATTACHMENT_STORAGE env var.

services:
  db:
    image: postgres:16
    environment:
      - POSTGRES_DB=odoo
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  web:
    image: odoo:19.0
    depends_on:
      - db
    ports:
      - "8069:8069"
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo
      # S3 storage backend configuration (optional)
      # Uncomment the lines below to enable the S3 attachment backend.
      # See .env.example for full documentation of each variable.
      # - IR_ATTACHMENT_STORAGE=s3
      # - AWS_S3_BUCKET=odoo-attachments
      # - AWS_ACCESS_KEY_ID=test
      # - AWS_SECRET_ACCESS_KEY=test
      # - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - ./odoo:/mnt/extra-addons
      - ./addons:/mnt/addons

volumes:
  db-data:
